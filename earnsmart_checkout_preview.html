<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnSmart Kenya Payments</title>
<style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#14213d}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 24px #0001}.plans{display:grid;gap:12px}.plan{padding:16px;border:1px solid #ddd;border-radius:14px}.pay{padding:12px 16px;border:0;border-radius:10px;background:#0b7a53;color:white;font-weight:700}.phone{padding:12px;width:100%;box-sizing:border-box;margin:10px 0;border:1px solid #bbb;border-radius:10px}</style></head>
<body><div class="wrap"><h1>EarnSmart Kenya</h1><p>Secure M-Pesa checkout</p><div class="card"><input id="phone" class="phone" placeholder="M-Pesa number e.g. 0712345678" inputmode="tel"><div class="plans">
<div class="plan"><h2>Starter — KES 99/month</h2><button class="pay" data-pay="starter" onclick="pay('starter')">Pay with M-Pesa</button></div>
<div class="plan"><h2>Pro — KES 249/month</h2><button class="pay" data-pay="pro" onclick="pay('pro')">Pay with M-Pesa</button></div>
<div class="plan"><h2>Premium — KES 499/month</h2><button class="pay" data-pay="premium" onclick="pay('premium')">Pay with M-Pesa</button></div>
</div></div></div>
<script>
async function pay(plan){const phone=document.getElementById('phone').value;const b=document.querySelector('[data-pay="'+plan+'"]');b.disabled=true;
try{const r=await fetch('/api/mpesa/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,phone})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Payment request failed');alert(d.message+'\n\nCheck your phone for the M-Pesa prompt.');}catch(e){alert(e.message)}finally{b.disabled=false}}
</script></body></html>
